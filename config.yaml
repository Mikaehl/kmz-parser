provider: ollama
network:
  endpoint_match_km: 0.5
route_planning:
  max_dijkstra_tool_calls: 16
closest:
  geocoder_url: https://nominatim.openstreetmap.org/search
  user_agent: KMZRouteParser/1.0
  timeout_seconds: 15
  max_distance_km: 10
ollama:
  base_url: http://ollama.home:11434
  model: ornith-1.5:9b
  timeout_seconds: 1800
openrouter:
  base_url: https://openrouter.ai/api/v1
  model1: qwen/qwen3.8-27b:free
  model: apodex/apodex-1.1-mini:free
  model2: dots-studio/dots-3-note-preview:free
  api_key_file: API_KEY_OPENROUTER
  site_url: ''
  app_name: KMZ Route Parser
  timeout_seconds: 600
  max_retries: 5
  retry_delay_seconds: 2
application:
  locale: fr
  output_directory: output
  log_directory: logs
  log_level: INFO
prompts_file: prompts.yaml
