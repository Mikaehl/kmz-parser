app_description: "Analyze routes in a KML or KMZ file with an AI provider."
argument_input: "KML or KMZ file to analyze."
argument_mlist: "List models installed on the configured Ollama server."
argument_muse: "Temporarily use the Ollama model at the index shown by --mlist."
argument_mchange: "Persistently set the configured Ollama model to the index shown by --mlist."
argument_mode: "Strategy: distance, shorter, djk (Dijkstra), ai-route (AI + Dijkstra tool), compare, ring, or diverse."
argument_check: "Use AI to check the consistency of objects in a KML/KMZ file."
argument_clist: "Display consistency anomalies saved in SQLite as a table."
argument_closest: "Address to geocode to find the nearest manhole."
argument_a_end: "Start point name for shorter, djk, ai-route, compare, ring, or diverse mode."
argument_z_end: "Destination point name for shorter, djk, ai-route, compare, ring, or diverse mode."
argument_cable: "Span ID or name to avoid when using diverse route endpoints."
argument_span: "Numeric ID of a built route to use as the diversity reference."
argument_build: "Save built routes to JSON/KMZ; compare and ring automatically create their KMZ."
argument_output: "Output JSON file path (optional)."
argument_config: "YAML configuration file path."
argument_locale: "Interface language: fr or en."
argument_provider: "Provider: ollama, openrouter, or or."
argument_openrouter: "Use OpenRouter."
argument_or: "Short alias for OpenRouter."
argument_verbose: "Enable debug logging."
log_started: "Analyzing file {path}."
log_total_duration: "Total request time: {duration_ms:.0f} ms."
log_analysis: "Mode used: {strategy}; AI model: {model}; diversity: {diversity}."
log_routes_found: "Found {count} valid route(s)."
log_output_written: "JSON result written to {path}."
