app_description: "Analyze routes in a KML or KMZ file with an AI provider."
argument_input: "KML or KMZ file to analyze."
argument_mode: "Strategy: distance, shorter, or diverse."
argument_closest: "Address to geocode to find the nearest manhole."
argument_a_end: "Start point name for shorter or diverse mode."
argument_z_end: "Destination point name for shorter or diverse mode."
argument_cable: "Span ID or name to avoid when using diverse route endpoints."
argument_span: "Numeric ID of a built route to use as the diversity reference."
argument_build: "Build a KMZ for shorter or a reference-based diverse route."
argument_output: "Output JSON file path (optional)."
argument_config: "YAML configuration file path."
argument_locale: "Interface language: fr or en."
argument_provider: "Provider: ollama, openrouter, or or."
argument_openrouter: "Use OpenRouter."
argument_or: "Short alias for OpenRouter."
argument_verbose: "Enable debug logging."
log_started: "Analyzing file {path}."
log_routes_found: "Found {count} valid route(s)."
log_output_written: "JSON result written to {path}."
error_input_missing: "KML/KMZ file does not exist: {path}"
error_file_invalid: "The KML/KMZ file is invalid or has unexpected content: {error}"
error_no_routes: "No usable LineString geometry was found in the KML."
error_mode_required: "Specify --mode or use --closest with an address."
error_closest_parameters: "--closest cannot be combined with --mode, route parameters, or --build."
error_no_manholes: "No candidate manholes were found in the KML."
error_geocoding: "Could not locate address: {error}"
error_too_far: "Too far from any possible connection point."
error_shorter_endpoints: "The --a-end and --z-end arguments are required with shorter mode."
error_diverse_parameters: "With diverse mode, provide --a-end/--z-end with --cable, or use --span alone (optionally with its endpoints)."
error_route_parameters: "The --a-end, --z-end, --cable, and --span arguments are only available with shorter or diverse mode."
error_cable_diverse_only: "The --cable and --span arguments are only available with diverse mode."
error_build_route_mode: "The --build option is only available with shorter or diverse mode."
error_route_planning: "Could not calculate a cable route: {error}"
log_kmz_written: "Route KMZ written to {path}."
error_api: "API request failed: {error}"
error_api_key_missing: "OpenRouter key file is missing, unreadable, or empty: {path}"
error_invalid_response: "Ollama returned an invalid route selection."
error_config: "Invalid configuration: {error}"
