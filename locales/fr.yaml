app_description: "Analyse les itinéraires d'un fichier KML ou KMZ avec un fournisseur d'IA."
argument_input: "Fichier KML ou KMZ à analyser."
argument_mode: "Stratégie: distance, shorter, djk (Dijkstra), compare ou diverse."
argument_closest: "Adresse à géocoder pour trouver le manhole le plus proche."
argument_a_end: "Nom du point de départ pour shorter, djk, compare ou diverse."
argument_z_end: "Nom du point de destination pour shorter, djk, compare ou diverse."
argument_cable: "ID ou nom du span à éviter avec les arguments de diverse."
argument_span: "ID numérique d'une route construite, utilisée comme référence de diversité."
argument_build: "Enregistre aussi le JSON de construction; compare génère automatiquement son KMZ."
argument_output: "Chemin du fichier JSON de sortie (optionnel)."
argument_config: "Chemin du fichier de configuration YAML."
argument_locale: "Langue de l'interface: fr ou en."
argument_provider: "Fournisseur: ollama, openrouter ou or."
argument_openrouter: "Utiliser OpenRouter."
argument_or: "Alias court pour OpenRouter."
argument_verbose: "Active les journaux de débogage."
log_started: "Analyse du fichier {path}."
log_analysis: "Mode utilisé : {strategy} ; modèle IA : {model} ; diversité : {diversity}."
log_routes_found: "{count} itinéraire(s) valide(s) trouvé(s)."
log_output_written: "Résultat JSON écrit dans {path}."
error_input_missing: "Le fichier KML/KMZ n'existe pas: {path}"
error_file_invalid: "Le fichier KML/KMZ est invalide ou son contenu est incorrect: {error}"
error_no_routes: "Aucune géométrie LineString exploitable n'a été trouvée dans le KML."
