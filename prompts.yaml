common:
  fr: >-
    Chaque extrémité d'une route est appelée « sites ». Les points intermédiaires
    sont appelés « manholes ». Une route complète est constituée de spans
    adjacents reliant les extrémités en passant par les points intermédiaires.
  en: >-
    Each route endpoint is called a "site". Intermediate points are called
    "manholes". A complete route consists of adjacent spans connecting its
    endpoints and passing through the intermediate points.

distance:
  fr: >-
    Retourne toutes les routes candidates, chacune avec son identifiant et sa distance
    calculee. Ne modifie jamais les distances fournies.
  en: >-
    Return every candidate route with its identifier and calculated distance.
    Never modify the supplied distances.

shorter:
  fr: >-
    Selectionne uniquement la route complete la plus courte, constituee d'une suite
    de cables adjacents passant par les manholes entre A-END et Z-END.
    En cas d'egalite, choisis la premiere.
    Retourne les points de départ et arrivé, la distance calculee et l'identifiant de la route.
  en: >-
    Select only the shortest complete route made of adjacent cables passing through
    the manholes between A-END and Z-END. If distances tie, select the first one.
    Return the start and end points, the calculated distance, and the route identifier.

compare:
  fr: >-
    Calcule le plus court itinéraire continu entre A-END et Z-END à partir des spans
    fournis. Retourne les identifiants route_id dans l'ordre, du départ à l'arrivée.
    Chaque span doit être utilisé au plus une fois. N'invente aucun identifiant.
  en: >-
    Calculate the shortest continuous route between A-END and Z-END using the supplied
    spans. Return route_id values in order from start to destination. Use each span at
    most once and do not invent identifiers.

ring:
  fr: >-
    Trouve deux itinéraires continus et aussi différents que possible entre A-END et
    Z-END à partir des spans fournis. Chaque itinéraire doit être une séquence ordonnée
    de spans contigus; les deux itinéraires ne doivent partager aucun span et ne doivent
    pas se croiser géométriquement hors des sites communs A-END et Z-END. N'invente aucun
    route_id. Le programme vérifiera la continuité et rejettera les routes invalides.
  en: >-
    Find two continuous and as geographically diverse as possible routes between
    A-END and Z-END from the supplied spans. Each route must be an ordered sequence of
    contiguous spans; the two routes must not share spans or cross geometrically except
    at the shared A-END and Z-END sites. Do not invent route_id values. The program
    validates continuity and rejects invalid routes.

diverse:
  fr: >-
    Selectionne deux routes aussi differentes que possible par leur trace geographique,
    pas seulement par leur nom ou leur longueur. Si la liste de candidates contient
    une seule route, retourne-la. Si moins de deux routes sont disponibles, retourne
    toutes les routes disponibles.
  en: >-
    Select two routes that are as geographically different as possible, not merely
    different in name or length. If the candidate list contains one route, return it.
    If fewer than two routes exist, return all available routes.

closest:
  fr: >-
    Parmi les manholes candidats, sélectionne celui qui est le plus proche de l'adresse
    fournie. Compare les distances géodésiques calculées localement et retourne un seul
    route_id. Ne modifie pas les distances et n'invente aucun point.
  en: >-
    From the candidate manholes, select the one closest to the supplied address.
    Compare the locally calculated geodesic distances and return exactly one route_id.
    Do not change distances or invent points.

check:
  fr: >-
    Vérifie la cohérence des objets du fichier KML/KMZ à partir de l'inventaire fourni.
    Repère uniquement les incohérences concrètes entre IDs, noms, types, dossiers,
    propriétés et géométries. Vérifie notamment les références ou raccordements qui
    ne correspondent pas aux objets présents et les objets manifestement mal formés.
    N'invente pas d'erreur quand les données ne permettent pas de conclure. Pour chaque
    anomalie, fournis le type d'objet, son object_id exact, l'incohérence trouvée,
    une explication factuelle et une solution possible. Ne retourne aucune ligne pour
    les objets cohérents. L'inventaire utilise des clés compactes : i = ID exact,
    t = type (P = Point, L = LineString), n = nom si différent de i, f = dossier,
    s = style, d = données complémentaires et g = géométrie. Une géométrie Point est
    [longitude, latitude]; une LineString est [nombre de sommets, [longitude, latitude]
    de début, [longitude, latitude] de fin]. Utilise uniquement les valeurs i présentes
    dans l'inventaire pour « id d'objet ».
  en: >-
    Check the consistency of the KML/KMZ objects using the supplied inventory.
    Report only concrete inconsistencies between IDs, names, types, folders,
    properties, and geometries. In particular, check references or connections that
    do not match existing objects and clearly malformed objects. Do not invent an
    issue when the data is insufficient. For each issue, provide the object type, its
    exact object_id, the inconsistency, a factual explanation, and a possible fix.
    Return no row for consistent objects. The inventory uses compact keys: i=exact ID,
    t=type (P=Point, L=LineString), n=name when different from i, f=folder, s=style,
    d=extended data, and g=geometry. A Point geometry is [longitude,latitude]; a
    LineString is [vertex_count,[start_lon,start_lat],[end_lon,end_lat]]. Use only i
    values from the inventory for id d'objet.
